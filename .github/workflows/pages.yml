# Sunucusuz (P2P) sürümü GitHub Pages'e yayınlar.
#
# GitHub'da: Settings → Pages → Build and deployment → Source: **GitHub Actions**
#
# Adres: https://<KULLANICI>.github.io/<DEPO>/
#
# Not: Bu iş akışı sunucu gerektirmez; oda durumu tarayıcılar arasında taşınır.

name: GitHub Pages (sunucusuz)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      # Pages daha önce etkinleştirilmediyse bu adım kendisi etkinleştirir.
      - name: Pages'i hazırla
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Sunucusuz derleme
        run: npm run build:p2p

      - name: SPA yedeği (404)
        run: cp dist/index.html dist/404.html

      - name: Artefaktı yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4